[project]
name = "hazard-detector"
version = "0.1.0"
description = "Hazard detection using YOLO and OpenCV"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ultralytics>=8.0.0",
]

[project.scripts]
hazard-detector = "hazard_detector:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]